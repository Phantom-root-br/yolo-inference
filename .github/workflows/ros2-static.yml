name: ROS2 static checks

on:
  push:
    paths:
      - "ros2/**"
      - "integration/**"
      - "vendor/simulation_bringup_eletroquad26/config/simulation/**"
      - "scripts/train_topdown_person.py"
      - ".github/workflows/ros2-static.yml"
  pull_request:
    paths:
      - "ros2/**"
      - "integration/**"
      - "vendor/simulation_bringup_eletroquad26/config/simulation/**"
      - "scripts/train_topdown_person.py"
      - ".github/workflows/ros2-static.yml"

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile Python sources
        run: |
          python -m py_compile \
            ros2/yolo_person_detector/yolo_person_detector/detector_node.py \
            ros2/yolo_person_detector/launch/detector.launch.py \
            ros2/yolo_person_detector/setup.py \
            scripts/train_topdown_person.py \
            integration/harpia/runtime/annotated_camera_viewer.py \
            integration/harpia/runtime/apply_final_runtime_fixes.py

      - name: Shell syntax
        run: |
          bash -n integration/harpia/run_detector.sh
          bash -n integration/harpia/runtime/open_annotated_camera.sh
          bash -n integration/harpia/runtime/run_harpia_yolo_with_viewer.sh
          bash -n integration/harpia/runtime/apply_and_build.sh
          bash -n integration/harpia/runtime/preflight.sh
          bash -n integration/harpia/runtime/monitor_mission.sh
          bash -n integration/harpia/runtime/run_from_zero.sh
          bash -n integration/harpia/runtime/check_host.sh
          bash -n integration/harpia/runtime/install_garden_bridge.sh
          bash -n integration/harpia/runtime/locate_final_external_assets.sh
          bash -n integration/harpia/runtime/audit_runtime_dependencies.sh
          bash -n integration/harpia/runtime/bootstrap_workspace.sh
          bash -n integration/harpia/runtime/package_validated_stack.sh
          bash -n integration/harpia/runtime/audit_distribution.sh
          bash -n integration/harpia/runtime/publish_validated_stack.sh
          bash -n vendor/simulation_bringup_eletroquad26/config/simulation/wait_and_start_yolo_mission.sh
          bash -n vendor/simulation_bringup_eletroquad26/config/simulation/start_px4_yolo_person.sh
          bash -n vendor/simulation_bringup_eletroquad26/config/simulation/start_garden_camera_bridge.sh
          bash -n vendor/simulation_bringup_eletroquad26/config/simulation/run_yolo_person.sh
