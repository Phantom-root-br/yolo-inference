[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]


[tool.ruff.lint.per-file-ignores]
"integration/harpia/runtime/apply_final_runtime_fixes.py" = ["I001"]
"ros2/yolo_person_detector/yolo_person_detector/detector_node.py" = ["I001"]

"yolo_person_mission/setup.py" = ["I001"]
"yolo_person_mission/yolo_person_mission/person_mission_node.py" = ["I001"]
